<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, user-scalable=no"
        />
        <meta name="referrer" content="no-referrer" />
        <meta http-equiv="Cache-Control" content="no-cache" />

        <title>VRCX-Pro</title>

        <link rel="preconnect" href="https://api.vrchat.cloud" />
        <link rel="preconnect" href="https://files.vrchat.cloud" />
        <link rel="preconnect" href="https://d348imysud55la.cloudfront.net" />
        <link rel="dns-prefetch" href="https://assets.vrchat.com" />
    </head>
    <body>
        <div id="root"></div>
        <div id="app-boot">
            <div class="boot-logo">
                <div class="boot-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
        <style>
            #app-boot {
                position: fixed;
                inset: 0;
                z-index: 99999;
                background: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 1;
                transition: opacity 0.4s ease;
            }
            @media (prefers-color-scheme: dark) {
                #app-boot {
                    background: #141416;
                }
            }
            #app-boot.boot-hidden {
                opacity: 0;
                pointer-events: none;
            }
            .boot-logo {
                width: 180px;
                height: 180px;
                position: relative;
            }
            .boot-dots {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 13px;
            }
            .boot-dots span {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #000000;
                animation: boot-dot 1.4s ease-in-out infinite;
            }
            .boot-dots span:nth-child(2) {
                animation-delay: 0.2s;
            }
            .boot-dots span:nth-child(3) {
                animation-delay: 0.4s;
            }
            @media (prefers-color-scheme: dark) {
                .boot-dots span {
                    background: #ffffff;
                }
            }
            @keyframes boot-dot {
                0%,
                100% {
                    opacity: 0.2;
                    transform: translateY(0);
                }
                50% {
                    opacity: 1;
                    transform: translateY(-3px);
                }
            }
        </style>
        <script type="module" src="app.js"></script>
    </body>
</html>
